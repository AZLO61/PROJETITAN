name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit structure
        run: npm run audit

      - name: Lint
        run: npm run lint

      # Reporter "github-actions" en plus du reporter normal : Vitest emet
      # alors des annotations que GitHub attache au commit, et un echec de CI
      # devient lisible sans avoir a ouvrir les logs bruts. Le premier echec
      # apres le rattachement du depot n'a donne qu'un « exit code 1 ».
      - name: Test
        run: npx vitest run --reporter=default --reporter=github-actions

      - name: Build
        run: npm run build
